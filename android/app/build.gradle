plugins {
    id "com.android.application"
}

android {
    namespace "com.mineradio.android"
    compileSdk 36

    defaultConfig {
        applicationId "com.mineradio.android"
        minSdk 26
        targetSdk 36
        versionCode 112
        versionName "1.1.2-android16"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            def storePath = project.findProperty("MINERADIO_RELEASE_STORE_FILE") ?: System.getenv("MINERADIO_RELEASE_STORE_FILE")
            def storePass = project.findProperty("MINERADIO_RELEASE_STORE_PASSWORD") ?: System.getenv("MINERADIO_RELEASE_STORE_PASSWORD")
            def aliasName = project.findProperty("MINERADIO_RELEASE_KEY_ALIAS") ?: System.getenv("MINERADIO_RELEASE_KEY_ALIAS")
            def keyPass = project.findProperty("MINERADIO_RELEASE_KEY_PASSWORD") ?: System.getenv("MINERADIO_RELEASE_KEY_PASSWORD")
            if (storePath && storePass && aliasName && keyPass) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias aliasName
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
